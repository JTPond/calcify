[package]
name = "calcify"
description = "Physics vector library"
version = "0.10.0"
authors = ["JTPond <jtpond42@gmail.com>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/JTPond/calcify"
license = "MIT OR Apache-2.0"
keywords = ["linear_algebra","vector","scientific_computing","matrix","physics"]
categories = ["science", "simulation"]

[features]
default = ["rand"]
rand = ["dep:rand"]

[dependencies]
rand = { version = "0.10", optional = true }
rmp = "^0.8"
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]
rand = "0.10"
rmp = "^0.8"
lazy_static = "^1.4"
chrono = "^0.4"
rayon = "^1.3"

[[example]]
name = "universe_in_a_box"
path = "examples/universe_in_a_box/main.rs"
required-features = ["rand"]

[badges]
maintenance = { status = "actively-developed" }
